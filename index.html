<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Social</title>

    <link rel="stylesheet" href="./css/style.css">
    <script type="module" src="./js/main.js"></script>
</head>

<body>

    <header>
        <div class="header-container">
            <h1 class="logo">Social</h1>
            <nav id="nav">
                <a href="./pages/login.html">Entrar</a>
                <a href="./pages/register.html">Cadastre-se</a>
            </nav>
        </div>
    </header>

    <main>
        <section id="create-post" hidden>
            <h2>Nova publicação</h2>
            <form id="post-form">

                <textarea
                    id="post-texto"
                    placeholder="O que você deseja compartilhar?"
                    required></textarea>

                <input
                    type="url"
                    id="post-img"
                    placeholder="URL da imagem (opcional)">
                <button type="submit">Publicar</button>
            </form>

            <p id="post-mensagem"></p>
        </section>

        <section id="feed">
            <h2>Publicações</h2>

            <div id="posts-container">
                <p>Carregando publicações...</p>
            </div>

        </section>
    </main>
    <dialog id="edit-modal">

    <h2 id="edit-title">Editar publicação</h2>

    <textarea id="edit-texto"></textarea>

    <div class="modal-buttons">
        <button id="cancel-edit">Cancelar</button>
        <button id="save-edit">Salvar</button>
    </div>

    </dialog>

    <dialog id="delete-modal">

        <h2>Excluir publicação?</h2>

        <p>Esta publicação será excluída permanentemente.</p>

        <div class="modal-buttons">
            <button id="cancel-delete">Cancelar</button>
            <button id="confirm-delete">Excluir</button>
        </div>

    </dialog>
</body>
</html>
